# Render Blueprint Specification — SetorKu
# Dokumentasi: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: setorku
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: SetorKu
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false # Isi dengan URL web service Render (contoh: https://setorku.onrender.com)
      - key: APP_KEY
        sync: false # Isi dengan kunci enkripsi Laravel (dihasilkan via: php artisan key:generate --show)
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # Konfigurasi Database TiDB Cloud Starter (MySQL Compatible)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false # Host gateway TiDB Cloud (contoh: gateway01.ap-southeast-1.prod.aws.tidbcloud.com)
      - key: DB_PORT
        value: "4000" # Port default TiDB Cloud adalah 4000
      - key: DB_DATABASE
        sync: false # Nama database di TiDB Cloud
      - key: DB_USERNAME
        sync: false # Username TiDB Cloud (format biasanya: <prefix>.root)
      - key: DB_PASSWORD
        sync: false # Password user TiDB Cloud
      - key: DB_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt # Path bundle CA Debian untuk TLS wajib TiDB

      # Sesi & Keamanan Cookie
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"

      # Google OAuth 2.0
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # Contoh: https://setorku.onrender.com/auth/google/callback

      # Akun Administrator Awal
      - key: SEED_ADMIN_EMAIL
        sync: false # Email Google Admin Pertama yang diizinkan mengelola sistem

      # Depot Bank Sampah (Titik Awal/Akhir Rute Penjemputan)
      - key: BANK_SAMPAH_NAME
        value: "Bank Sampah SetorKu Yogyakarta"
      - key: BANK_SAMPAH_LAT
        value: "-7.7970680"
      - key: BANK_SAMPAH_LNG
        value: "110.3705290"
